name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NURSE_RULES_ONLY: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install app dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python, Action CLI, and browser JavaScript
        run: |
          python -m compileall -q nurse.py action/nurse_cli.py activity_log.py memory_bridge.py integrations tests
          node --check web/app.js
      - name: Test validator and Action fixtures
        run: |
          python -m unittest discover -s tests -v
          for fixture in fixtures/*.txt; do
            NURSE_LOG_PATH="$fixture" NURSE_OUTPUT=/tmp/nurse-report.md python action/nurse_cli.py
          done
      - name: Build and smoke-test the Docker Compose deployment
        run: |
          trap 'docker compose logs --no-color || true; docker compose down --volumes --remove-orphans || true' EXIT
          docker compose config --quiet
          docker compose up -d --build
          ready=0
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8787/api/health >/dev/null; then
              ready=1
              break
            fi
            # surface crash loops early
            if [ $((attempt % 10)) -eq 0 ]; then
              docker compose ps || true
              docker compose logs --no-color --tail=40 || true
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "service never became healthy"
            docker compose ps || true
            docker compose logs --no-color || true
            exit 1
          fi
          curl -fsS http://127.0.0.1:8787/api/health
          curl -fsS http://127.0.0.1:8787/demo-assets/red-actions-permission-failure.png >/dev/null
          ./scripts/smoke.sh
